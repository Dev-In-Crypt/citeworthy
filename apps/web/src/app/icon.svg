<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Знак продукта по брендбуку (logo-symbol.svg): цитатные скобки [•] на
    индиговой плитке.

    Продукт про то, процитирован ли клиент в ответе ассистента, а в тексте
    ссылка на источник выглядит как [1]. Скобки читаются на 16 пикселях, где
    любая буква уже превращается в пятно. Формат SVG, а не png: сборка
    герметична, файл ничего не грузит и одинаково выглядит в обеих темах
    браузера.
  -->
  <rect width="32" height="32" rx="7" fill="#4F39F6" />
  <path fill="#FFFFFF" d="M6 6 L14 6 L14 10 L10 10 L10 22 L14 22 L14 26 L6 26 Z M26 6 L18 6 L18 10 L22 10 L22 22 L18 22 L18 26 L26 26 Z" />
  <circle fill="#FFFFFF" cx="16" cy="16" r="3" />
</svg>
