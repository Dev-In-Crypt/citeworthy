<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Знак продукта: цитатные скобки с точкой между ними.

    Продукт про то, процитирован ли клиент в ответе ассистента, а в тексте
    ссылка на источник выглядит как [1]. Скобки читаются на 16 пикселях, где
    любая буква уже превращается в пятно. Формат SVG, а не png: сборка
    герметична, файл ничего не грузит и одинаково выглядит в обеих темах
    браузера.
  -->
  <rect width="32" height="32" rx="7" fill="#4f46e5" />
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="square">
    <path d="M13 8 H9 V24 H13" />
    <path d="M19 8 H23 V24 H19" />
  </g>
  <circle cx="16" cy="16" r="2.2" fill="#ffffff" />
</svg>
